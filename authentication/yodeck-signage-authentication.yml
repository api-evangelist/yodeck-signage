schemes:
- name: tokenAuth
  type: apiKey
  in: header
  parameter: Authorization
  description: Named, role-scoped API token generated in the Yodeck console (Account Settings
    > Advanced Settings > API Tokens). The token acts as a user with the permissions of its
    assigned role. Send it in the Authorization header as "Token name:secret" -- confirmed
    working against the v2 API by a user's authenticated test (yodeck-signage#1, 2026-09-03).
    VERSION MATTERS -- the same header fails against /api/v1, and unauthenticated probes show
    why. v1 routes (/media, /screens, /playlists) return 404 while their v2 twins return 401,
    with invented control paths 404ing on both, so the v1 surface no longer routes at all. The
    header format was previously hedged as documented-in-the-login-gated-reference and should be confirmed
    there.
